[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstream"
version = "0.1.0"
description = "Real-time quant research and signal pipeline: Spark Structured Streaming, AWS Glue, and ML signal models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "y2ksayed" }]
keywords = ["quant", "trading", "pyspark", "streaming", "aws-glue", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pyspark==3.5.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "kafka-python==2.0.2",
    "boto3==1.34.100",
    "pyarrow==15.0.0",
    "matplotlib==3.8.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "build",
    "twine",
    "ruff",
]
notebook = [
    "jupyter==1.0.0",
]

[project.scripts]
quantstream-produce = "quantstream.market_producer:main"
quantstream-backtest = "quantstream.quant:main"
quantstream-train = "quantstream.ml_signal:main"
quantstream-sample-data = "quantstream.generate_sample_data:main"

[project.urls]
Homepage = "https://github.com/y2ksayed/auto-trading-quant-aws-glue"

[tool.setuptools.packages.find]
include = ["quantstream*"]

[tool.ruff]
line-length = 100
target-version = "py310"
